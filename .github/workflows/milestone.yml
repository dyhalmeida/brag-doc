name: Auto-assign Win milestone

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/edges/assign-milestone.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
